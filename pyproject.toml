[project]
name = "datetime-mcp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dateparser>=1.5.0",
    "fastmcp>=4.1.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dateutil>=4.0.0",
    "tzdata>=2026.6",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"

addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]

markers = [
    "unit: Unit tests for utilities",
    "service: Service-level tests",
    "model: Pydantic model validation tests",
    "integration: MCP integration tests",
    "contract: MCP tool schema and interface tests",
    "slow: Tests that take longer to execute",
]